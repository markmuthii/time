<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="controls">
      <button
        id="settings-open"
        aria-label="Open settings"
        aria-controls="settings"
        aria-expanded="false"
      >
        <svg viewBox="0 0 16 16">
          <path
            d="M6.69 2.76L6.87 0.89L9.13 0.89L9.31 2.76A5.4 5.4 0 0 1 10.78 3.37L12.23 2.18L13.82 3.77L12.63 5.22A5.4 5.4 0 0 1 13.24 6.69L15.11 6.87L15.11 9.13L13.24 9.31A5.4 5.4 0 0 1 12.63 10.78L13.82 12.23L12.23 13.82L10.78 12.63A5.4 5.4 0 0 1 9.31 13.24L9.13 15.11L6.87 15.11L6.69 13.24A5.4 5.4 0 0 1 5.22 12.63L3.77 13.82L2.18 12.23L3.37 10.78A5.4 5.4 0 0 1 2.76 9.31L0.89 9.13L0.89 6.87L2.76 6.69A5.4 5.4 0 0 1 3.37 5.22L2.18 3.77L3.77 2.18L5.22 3.37A5.4 5.4 0 0 1 6.69 2.76Z"
          />
          <circle cx="8" cy="8" r="2.3" />
        </svg>
      </button>
      <button id="zoom-out" aria-label="Zoom out">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="7" />
          <path d="M4.5 8h7" />
        </svg>
      </button>
      <button id="zoom-in" aria-label="Zoom in">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="7" />
          <path d="M4.5 8h7M8 4.5v7" />
        </svg>
      </button>
      <button id="fullscreen" aria-label="Enter fullscreen">
        <svg viewBox="0 0 16 16">
          <path
            class="fs-enter"
            d="M1.5 1.5l5 5M1.5 5.5v-4h4M14.5 1.5l-5 5M14.5 5.5v-4h-4M1.5 14.5l5-5M1.5 10.5v4h4M14.5 14.5l-5-5M14.5 10.5v4h-4"
          />
          <path
            class="fs-exit"
            d="M1.5 1.5l5 5M6.5 2.5v4h-4M14.5 1.5l-5 5M9.5 2.5v4h4M1.5 14.5l5-5M6.5 13.5v-4h-4M14.5 14.5l-5-5M9.5 13.5v-4h4"
          />
        </svg>
      </button>
    </div>

    <main class="stage" id="stage">
      <div class="clock" id="clock">
        <div class="time">
          <span id="time"
            ><span class="digit digit-one">1</span><span class="digit">0</span
            ><span class="colon">:</span><span class="digit">0</span
            ><span class="digit">7</span><span class="colon">:</span
            ><span class="digit">3</span><span class="digit">3</span></span
          ><span class="ampm" id="ampm">PM</span>
        </div>
        <div class="date" id="date">TUE - OCT 6, 2026</div>
      </div>
    </main>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside
      class="drawer"
      id="settings"
      aria-label="Settings"
      aria-hidden="true"
      inert
    >
      <header class="drawer-header">
        <h2>Settings</h2>
        <button
          class="drawer-close"
          id="settings-close"
          aria-label="Close settings"
        >
          <svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg>
        </button>
      </header>

      <section class="setting">
        <h3>Time format</h3>
        <div class="segmented" role="radiogroup" aria-label="Time format">
          <label
            ><input type="radio" name="format" value="12" /><span
              >12 hour</span
            ></label
          >
          <label
            ><input type="radio" name="format" value="24" /><span
              >24 hour</span
            ></label
          >
        </div>
      </section>

      <section class="setting">
        <h3>Color</h3>
        <div
          class="swatches"
          id="swatches"
          role="radiogroup"
          aria-label="Clock color"
        ></div>
        <label class="custom-color">
          <input type="color" id="custom-color" />
          <span>Custom color</span>
        </label>
      </section>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
